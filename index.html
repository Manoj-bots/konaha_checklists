<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B170E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Daily Checklist</title>
</head>
<body>
<main>
  <section class="date-card">
    <div class="eyebrow">DAILY CHECKLIST</div>
    <div id="weekday"></div>
    <div id="day"></div>
    <div id="month"></div>
    <div id="clock"></div>
  </section>

  <section class="widget">
    <header><h2>☀ Everyday Tasks</h2><strong id="dailyPct">0%</strong></header>
    <div id="dailyList"></div>
    <div class="add"><input id="dailyInput" placeholder="Add daily task"><button onclick="addTask('daily')">＋</button></div>
    <div class="progress"><i id="dailyBar"></i></div>
  </section>

  <section class="widget">
    <header><h2>📝 Today's Tasks</h2><strong id="todayPct">0%</strong></header>
    <div id="todayList"></div>
    <div class="add"><input id="todayInput" placeholder="Add task for today"><button onclick="addTask('today')">＋</button></div>
    <div class="progress today"><i id="todayBar"></i></div>
  </section>

  <section class="widget">
    <header><h2>📅 Weekly Tasks</h2><strong id="weeklyPct">0%</strong></header>
    <div id="weeklyList"></div>
    <div class="add"><input id="weeklyInput" placeholder="Add weekly task"><button onclick="addTask('weekly')">＋</button></div>
    <div class="progress weekly"><i id="weeklyBar"></i></div>
  </section>

  <section class="widget">
    <header><h2>◉ Overall Progress</h2><strong id="overallPct">0%</strong></header>
    <div class="progress overall"><i id="overallBar"></i></div>
    <div class="summary">
      <span>Daily <b id="dailySummary">0/0</b></span>
      <span>Today <b id="todaySummary">0/0</b></span>
      <span>Weekly <b id="weeklySummary">0/0</b></span>
    </div>
  </section>

  <section class="widget">
    <header><h2>✦ Notes</h2><small>Auto-save</small></header>
    <textarea id="notes" placeholder="Quick notes..."></textarea>
  </section>

  <section class="actions">
    <button onclick="resetToday()">↻ Reset Today</button>
    <button onclick="resetWeek()">↻ Reset Week</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
